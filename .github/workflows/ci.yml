name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript, contract tests and packaged exports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-package-${{ github.sha }}
          path: artifacts/*.tgz
          if-no-files-found: error

  supply-chain:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check:audit
      - run: bun dedupe --check
      - run: bun pm licenses

  android:
    name: Kotlin format, Debug/Release compile and Android Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bun run check:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-${{ github.sha }}
          path: android/build/reports/lint-results-*

  ios:
    name: Objective-C format, compile and static analysis
    # Xcode 27.2 matches the local compiler; pin it instead of the image default.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Install pinned formatter locally
        run: |
          python3 -m venv .tools/clang-format
          .tools/clang-format/bin/pip install clang-format==21.1.8
      - name: Fetch real pinned Lynx 3.9.0 header
        run: |
          curl --fail --location --output .tools/LynxModule.h https://raw.githubusercontent.com/lynx-family/lynx/3.9.0/platform/darwin/common/lynx/public/module/LynxModule.h
          echo '05f32949a284516edd7897ec9f5ecc7e9484777e327c475c88102f924e3b3114  .tools/LynxModule.h' | shasum -a 256 --check
      - run: bun run check:ios
        env:
          LYNX_MODULE_HEADER: .tools/LynxModule.h
      - uses: actions/upload-artifact@v4
        with:
          name: ios-analysis-${{ github.sha }}
          path: artifacts/ios/analysis.plist
          if-no-files-found: error
