name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS — typecheck, lint, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Тарбол это и есть весь деливерабл: autolink компилирует нативные
      # исходники у потребителя, поэтому их отсутствие в пакете = мёртвая
      # библиотека, и заметить это без проверки нельзя.
      - name: Проверить содержимое тарбола
        run: node scripts/check-publishable.mjs

  android:
    name: Android — компиляция
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: assembleRelease
        working-directory: android-check
        run: gradle :lynx-crypto:assembleRelease --no-daemon --stacktrace
